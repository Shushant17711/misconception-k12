[project]
name = "mk12"
version = "0.1.0"
description = "Misconception detection in K-12 student math workings (Kaggle)"
license = "MIT"
authors = [{name = "Shushant Kumar Choudhary"}]
requires-python = ">=3.12"
dependencies = ["pandas", "pyarrow", "scikit-learn", "numpy", "scipy"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mk12"]
